defaults:
  - _self_

num_envs: 1
freq: 40 # can only be divisible by 200
camera_follow: False
env_name: warehouse # Use default for better G1 stability

sensor:
  enable_lidar: False # Disable LiDAR for G1 to avoid issues
  enable_camera: True
  color_image: True
  depth_image: True
  semantic_segmentation: True

sim_app:
  anti_aliasing: 0
  width: 1280
  height: 720
  hide_ui: False

# G1-specific settings
robot_type: g1 # For unified launcher
debug_mode: True # Enable comprehensive logging
